spring:
  application:
    name: tesouraria
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /docs/api

management:
  endpoints:
    web:
      exposure:
        include: health,info

tesouraria:
  security:
    jwt-secret: ${TESOURARIA_JWT_SECRET:troque-este-segredo-em-producao-ele-precisa-ter-pelo-menos-32-bytes}
    jwt-expiration-minutes: 480
  moeda-base: BRL

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/tesouraria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:tesouraria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tesouraria}
    username: ${DATABASE_USER:tesouraria}
    password: ${DATABASE_PASSWORD:tesouraria}
  h2:
    console:
      enabled: false
